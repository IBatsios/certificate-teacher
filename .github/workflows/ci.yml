name: ci
on:
  push:
    branches-ignore: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: pnpm install
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Test
        run: pnpm test

  # The browser tests need a database and a place for magic-link emails to land.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: teacher
          POSTGRES_PASSWORD: teacher
          POSTGRES_DB: teacher
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teacher"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.29
        ports:
          - 1025:1025
          - 8025:8025
    env:
      DATABASE_URL: postgresql://teacher:teacher@localhost:5432/teacher
      EMAIL_SERVER: smtp://localhost:1025
      EMAIL_FROM: Teacher <teacher@localhost>
      MAILPIT_URL: http://localhost:8025
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: pnpm install
      - name: Session secret for this run only
        run: echo "AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: Migrate
        run: pnpm prisma migrate deploy
      - name: Browser
        run: pnpm playwright install --with-deps chromium
      - name: Build
        run: pnpm build
      - name: Browser tests
        run: pnpm test:e2e
      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
